<!DOCTYPE html>
<html lang="en" data-bs-theme="dark" style="color-scheme: dark;">

<head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Upload a file</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #212121;
            --panel: #303030;
            --field: #2a2a2a;
            --field-hover: #323232;
            --chip: #424242;
            --line: rgba(255, 255, 255, .12);
            --line-strong: rgba(255, 255, 255, .24);
            --text: #ececec;
            --text-muted: #a1a1a1;
            --text-faint: #8f8f8f;
            --danger: #ff8a80;
            --success: #7ee2a8;
        }

        html,
        body {
            height: 100%;
        }

        body {
            background: let(--bg);
            color: var(--text);
            color-scheme: dark;
            font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* centering */
        .page {
            min-height: 100%;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .shell {
            width: 100%;
            max-width: 420px;
        }

        /* header */

        .mark {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: var(--panel);
            border: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.25rem;
            transform: scale(1.5)
        }


        .title {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -.02em;
            text-align: center;
            margin: 0 0 .375rem;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: .9375rem;
            text-align: center;
            margin: 0 0 1.75rem;
        }

        /* card */

        .card-box {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 1.25rem;
            padding: 1.25rem;
        }

        .form-label {
            color: var(--text);
            font-size: .8125rem;
            font-weight: 500;
            margin-bottom: .5rem;
        }

        /* select */

        .form-select {
            background-color: var(--field);
            border: 1px solid var(--line);
            color: var(--text);
            border-radius: .75rem;
            padding: .6875rem .875rem;
            padding-right: 2.75rem;
            font-size: .9375rem;
            cursor: pointer;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%23a1a1a1' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='m2 5 6 6 6-6'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right .9rem center;
            background-size: 13px 10px;
            transition: border-color .15s ease, background-color .15s ease;
        }

        .form-select:hover {
            background-color: var(--field-hover);
            border-color: var(--line-strong);
        }

        .form-select:focus-visible {
            background-color: var(--field);
            color: var(--text);
            border-color: rgba(255, 255, 255, .4);
            box-shadow: none;
            outline: none;
        }

        .form-select option {
            background-color: var(--field);
            color: var(--text);
        }

        .form-select.is-placeholder {
            color: var(--text-faint);
        }

        /* drop area */

        .dropzone {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: .5rem;
            width: 100%;
            padding: 1.5rem 1rem;
            background: var(--field);
            border: 1px dashed var(--line-strong);
            border-radius: .75rem;
            cursor: pointer;
            text-align: center;
            transition: background .15s ease, border-color .15s ease;
        }

        .dropzone:hover {
            background: var(--field-hover);
            border-color: rgba(255, 255, 255, .38);
        }

        .dropzone:focus-visible {
            outline: 2px solid rgba(255, 255, 255, .4);
            outline-offset: 2px;
        }

        .dropzone.is-dragging {
            background: #383838;
            border-color: #fff;
        }

        .dropzone svg {
            width: 22px;
            height: 22px;
            stroke: var(--text-muted);
        }

        .dropzone-main {
            font-size: .9375rem;
            color: var(--text);
        }

        .dropzone-sub {
            font-size: .8125rem;
            color: var(--text-faint);
        }

        /* selected-file chip (after file selection) */
        .file-chip {
            display: flex;
            align-items: center;
            gap: .75rem;
            padding: .75rem .875rem;
            background: var(--field);
            border: 1px solid var(--line);
            border-radius: .75rem;
        }

        .file-icon {
            flex: 0 0 auto;
            width: 34px;
            height: 34px;
            border-radius: 8px;
            background: var(--chip);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .file-icon svg {
            width: 16px;
            height: 16px;
            stroke: var(--text);
        }

        .file-meta {
            min-width: 0;
            flex: 1 1 auto;
        }

        .file-name {
            font-size: .875rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-size {
            font-size: .75rem;
            color: var(--text-faint);
        }

        .file-remove {
            flex: 0 0 auto;
            width: 28px;
            height: 28px;
            border: 0;
            border-radius: 999px;
            background: transparent;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background .15s ease, color .15s ease;
        }

        .file-remove:hover {
            background: var(--chip);
            color: var(--text);
        }

        .file-remove svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
        }

        /* button */

        .btn-white {
            width: 100%;
            background: #fff;
            color: #0d0d0d;
            border: 0;
            border-radius: 999px;
            font-size: .9375rem;
            font-weight: 500;
            padding: .6875rem 1.25rem;
            transition: background .15s ease;
        }

        .btn-white:hover:not(:disabled) {
            background: #e3e3e3;
        }

        .btn-white:disabled {
            background: #4a4a4a;
            color: var(--text-faint);
            opacity: 1;
            cursor: not-allowed;
        }

        /* status */

        .status {
            font-size: .875rem;
            text-align: center;
            margin: 1rem 0 0;
            min-height: 1.25rem;
        }

        .status.muted {
            color: var(--text-muted);
        }

        .status.error {
            color: var(--danger);
        }

        .status.success {
            color: var(--success);
        }

        .visually-hidden-input {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0 0 0 0);
            white-space: nowrap;
            border: 0;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>

    <div class="page">
        <div class="shell">

            <div class="mark">
                🗂️
            </div>

            <h1 class="title">Upload a file</h1>
            <p class="subtitle">Personal Job Documents Uploader</p>

            <div class="card-box">
                <form id="myForm">

                    <div class="mb-3">
                        <label for="fileType" class="form-label d-block">Document type</label>
                        <select name="fileType" id="fileType" class="form-select is-placeholder"
                            onchange="syncPlaceholder()">
                            <option value="">Select a document type</option>
                            <option value="Resume">Resume</option>
                            <option value="Cover Letter">Cover Letter</option>
                            <option value="Job Description">Job Description</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="myFile" class="form-label d-block">File</label>

                        <input type="file" name="myFile" id="myFile" class="visually-hidden-input">

                        <label for="myFile" id="dropzone" class="dropzone" tabindex="0">
                            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.75" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                                <path d="M7 10l5-5 5 5" />
                                <path d="M12 5v12" />
                            </svg>
                            <span class="dropzone-main">Click to choose a file</span>
                            <span class="dropzone-sub">or drag and drop it here</span>
                        </label>

                        <div id="fileChip" class="file-chip hidden">
                            <span class="file-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke-width="1.75" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                                    <path d="M14 2v6h6" />
                                </svg>
                            </span>
                            <span class="file-meta">
                                <div class="file-name" id="fileName"></div>
                                <div class="file-size" id="fileSize"></div>
                            </span>
                            <button type="button" class="file-remove" onclick="clearFile()" aria-label="Remove file">
                                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round">
                                    <path d="M18 6 6 18M6 6l12 12" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <button type="button" id="uploadBtn" class="btn btn-white" onclick="upload()">Upload file</button>
                </form>

                <p id="status" class="status muted"></p>
            </div>

        </div>
    </div>

    <script>
        var fileInput = document.getElementById('myFile');
        var dropzone = document.getElementById('dropzone');

        // select placeholder

        function syncPlaceholder() {
            var select = document.getElementById('fileType');
            select.classList.toggle('is-placeholder', select.value === '');
        }

        // file selection

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / 1048576).toFixed(1) + ' MB';
        }

        function renderFile() {
            var chip = document.getElementById('fileChip');

            if (fileInput.files.length === 0) {
                chip.classList.add('hidden');
                dropzone.classList.remove('hidden');
                return;
            }

            var file = fileInput.files[0];
            document.getElementById('fileName').textContent = file.name;
            document.getElementById('fileSize').textContent = formatSize(file.size);
            dropzone.classList.add('hidden');
            chip.classList.remove('hidden');
        }

        function clearFile() {
            fileInput.value = '';
            renderFile();
            setStatus('', 'muted');
        }

        fileInput.addEventListener('change', function () {
            renderFile();
            setStatus('', 'muted');
        });

        dropzone.addEventListener('keydown', function (event) {
            if (event.key === 'Enter' || event.key === ' ') {
                event.preventDefault();
                fileInput.click();
            }
        });

        // drag and drop funcionality

        ['dragenter', 'dragover'].forEach(function (name) {
            dropzone.addEventListener(name, function (event) {
                event.preventDefault();
                dropzone.classList.add('is-dragging');
            });
        });

        ['dragleave', 'drop'].forEach(function (name) {
            dropzone.addEventListener(name, function () {
                dropzone.classList.remove('is-dragging');
            });
        });

        dropzone.addEventListener('drop', function (event) {
            event.preventDefault();
            var dropped = event.dataTransfer.files;
            if (dropped.length === 0) return;

            // Keep only the first file — this form takes one
            let single = new DataTransfer();
            single.items.add(dropped[0]);
            fileInput.files = single.files;

            renderFile();
            setStatus('', 'muted');
        });

        // Stop the browser opening files dropped outside the zone
        window.addEventListener('dragover', function (e) { e.preventDefault(); });
        window.addEventListener('drop', function (e) { e.preventDefault(); });

        function setStatus(message, kind) {
            var status = document.getElementById('status');
            status.className = 'status ' + (kind || 'muted');
            status.textContent = message;
        }

        function upload() {
            var typeInput = document.getElementById('fileType');

            if (!typeInput.value) {
                setStatus('Select a document type first.', 'error');
                return;
            }

            if (fileInput.files.length === 0) {
                setStatus('Pick a file first.', 'error');
                return;
            }

            document.getElementById('uploadBtn').disabled = true;
            setStatus('Uploading...', 'muted');

            google.script.run
                .withSuccessHandler(onSuccess)
                .withFailureHandler(onFailure)
                .doUpload(document.getElementById('myForm'));
        }

        function onSuccess(message) {
            document.getElementById('uploadBtn').disabled = false;
            setStatus(message, 'success');
            document.getElementById('myForm').reset();
            syncPlaceholder();
            renderFile();
        }

        function onFailure(error) {
            document.getElementById('uploadBtn').disabled = false;
            setStatus('Error: ' + error.message, 'error');
        }
    </script>

</body>

</html>
